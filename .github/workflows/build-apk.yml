name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "错误：预装 Android SDK 未找到于 $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDK root = $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties
          echo "--- platforms ---"
          ls "$SDK_ROOT/platforms"
          echo "--- build-tools ---"
          ls "$SDK_ROOT/build-tools"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ok=0
          for i in 1 2; do
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              ok=1
              break
            fi
            echo "::warning::构建失败（第 $i 次），15 秒后重试..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::重试后构建仍然失败"
            exit 1
          fi

      - name: List output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVidHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
