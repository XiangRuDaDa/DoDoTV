name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: DouDouTV

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "错误：预装 Android SDK 未找到于 $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDK root = $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties
          echo "--- platforms ---"
          ls "$SDK_ROOT/platforms"
          echo "--- build-tools ---"
          ls "$SDK_ROOT/build-tools"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ok=0
          for i in 1 2; do
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              ok=1
              break
            fi
            echo "::warning::构建失败（第 $i 次），15 秒后重试..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::重试后构建仍然失败"
            exit 1
          fi

      - name: List output
        run: ls -lh app/build/outputs/apk/debug/

      # 不做任何压缩，直接拿到 .apk 原始文件
      - name: Prepare raw APK
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*versionName *= *"\(.*\)".*/\1/')
          APK_NAME="${APP_NAME}-v${VERSION}-${GITHUB_REF_NAME}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          ls -lh "dist/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      # 通过 GitHub Release 发布原始 APK：下载链接点开就是 .apk，不是 zip
      - name: Publish raw APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}-latest"
          PRERELEASE=""
          if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "master" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "dist/${APK_NAME}" \
            --target "$GITHUB_SHA" \
            --title "${APP_NAME} ${GITHUB_REF_NAME} 最新构建" \
            --notes "自动构建：${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}，点击下方 ${APK_NAME} 直接下载安装，无需解压。" \
            $PRERELEASE
          echo "### 直接下载 APK（无压缩、无 zip）" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"
